[project]
name = "chatterbox-tts"
version = "0.1.7"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    # numpy 1.x for Python < 3.13 (no 1.x wheels on 3.13+), numpy 2.x for 3.13+
    "numpy>=1.24.0,<2.0.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
    "librosa==0.11.0",
    "s3tokenizer",
    # torch 2.6.0 supports Python 3.10-3.13; Python 3.14 needs 2.9.0+
    "torch==2.6.0; python_version < '3.14'",
    "torch>=2.9.0; python_version >= '3.14'",
    "torchaudio==2.6.0; python_version < '3.14'",
    "torchaudio>=2.9.0; python_version >= '3.14'",
    "transformers==5.2.0",
    "diffusers==0.29.0",
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg",
    "pykakasi==2.3.0",
    "gradio==6.8.0",
    "pyloudnorm",
    "omegaconf",

    # Runtime dependencies for russian-text-stresser. The package itself is
    # installed without its incompatible spaCy 3.6 pin on the first Russian request.
    "beautifulsoup4>=4.11.1",
    "lxml>=4.9.1",
    "pymorphy2>=0.9.1",
    "pymorphy2-dicts-ru>=2.4.417127.4579844",
    "spacy==3.8.11",
    "stressed-cyrillic-tools>=0.1.10",
    "transliterate>=1.10.2",
    "russian-stress @ git+https://github.com/Vuizur/add-stress-to-epub.git@9e064c815373ef6f0360dd97b0d0fc37b52d256f"
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
